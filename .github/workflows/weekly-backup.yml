name: Weekly Firestore Backup

on:
  schedule:
    # 11:30 PM Eastern Sunday (EDT = UTC-4, so 03:30 UTC Monday)
    - cron: '30 3 * * 1'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Run Firestore backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEAM_CODE: SBSL-14USB
        run: node backup-firestore.js
        working-directory: scripts

      - name: Commit backup file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "chore: weekly Firestore backup $(date -u +%Y-%m-%d)"
          git push
